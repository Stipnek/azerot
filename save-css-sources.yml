name: Save verified CSS sources
on:
  push:
    branches: ['test/css-roundtrip']
    paths: ['.github/workflows/save-css-sources.yml']
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Extract and rebuild
        run: |
          mkdir src
          python3 - <<'PY'
          from contextlib import nullcontext
          from pathlib import Path
          import re
          import runpy
          from unittest.mock import patch
          with patch('tempfile.TemporaryDirectory', return_value=nullcontext('src')):
              runpy.run_path('scripts/check_css_roundtrip.py', run_name='__main__')
          def read_css(match):
              i = int(match.group(1))
              return Path('src', 'styles.css' if i == 1 else f'styles-{i}.css').read_bytes()
          rebuilt, count = re.subn(rb'__AZEROT_CSS_BLOCK_([1-9][0-9]*)__', read_css, Path('src/template.html').read_bytes())
          original = Path('game-1.txt').read_bytes() + Path('game-2.txt').read_bytes()
          if not count or rebuilt != original:
              raise SystemExit('Rebuild from src differs from original')
          print(f'OK: rebuilt {len(rebuilt)} identical bytes from {count} CSS files')
          PY
      - name: Commit verified sources to test branch
        run: |
          test "$GITHUB_REF" = refs/heads/test/css-roundtrip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/
          git commit -m 'Add verified HTML template and CSS sources'
          git push origin HEAD:refs/heads/test/css-roundtrip
