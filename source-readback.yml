name: Temporary source readback
on:
  push:
    branches: ['work/roster-xp-and-updates']
    paths: ['.github/workflows/source-readback.yml']
permissions:
  contents: write
concurrency:
  group: source-readback
  cancel-in-progress: false
jobs:
  readback:
    if: github.ref == 'refs/heads/work/roster-xp-and-updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/roster-xp-and-updates
      - name: Export exact current sources in readable chunks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess
          out = Path('dev-readback')
          if out.exists():
              raise SystemExit('Refusing to overwrite an existing readback directory')
          out.mkdir()
          manifest = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'sources': []}
          symbols = []
          for name in ['script-05.txt', 'script-06.txt']:
              path = Path('src/scripts') / name
              raw = path.read_bytes()
              text = raw.decode('utf-8')
              chunks = []
              for start in range(0, len(text), 8000):
                  part = text[start:start + 8000]
                  target = out / (name + '.part-' + str(start // 8000 + 1).zfill(3) + '.txt')
                  target.write_bytes(part.encode('utf-8'))
                  chunks.append({'file': target.name, 'start_character': start, 'end_character': start + len(part)})
              restored = b''.join((out / c['file']).read_bytes() for c in chunks)
              assert restored == raw, name
              manifest['sources'].append({'path': str(path), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'chunks': chunks})
              for match in re.finditer(r'function\s+([A-Za-z_$][\w$]*)\s*\(', text):
                  if re.search(r'xp|level|reward|victory|skip|complete|finish|result', match[1], re.I):
                      symbols.append({'source': name, 'function': match[1], 'part': match.start() // 8000 + 1, 'character': match.start()})
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'reward-symbols.json').write_text(json.dumps(symbols, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit readback files only to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dev-readback/
          git diff --cached --quiet && exit 0
          git commit -m 'chore: export verified source chunks for reward audit'
          git push origin HEAD:refs/heads/work/roster-xp-and-updates
