name: Extract script sources
on:
  push:
    branches: ['test/css-roundtrip']
    paths: ['.github/workflows/extract-scripts.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python3 scripts/script_sources.py --extract
      - name: Save verified sources
        run: |
          test "$GITHUB_REF" = refs/heads/test/css-roundtrip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/template.html src/scripts/
          git commit -m 'Separate script tag bodies with identical rebuild'
          git push origin HEAD:refs/heads/test/css-roundtrip
