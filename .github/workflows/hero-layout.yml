name: Hero layout regression
on:
  pull_request:
    paths: ['src/**', 'scripts/**', '.github/workflows/hero-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_source_edits.py
      - run: python3 scripts/build_combined_preview.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 scripts/test_hero_skill_groups.py
      - run: python3 scripts/test_hero_tree_navigation.py
      - run: python3 scripts/test_hero_layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-layout-results
          path: test-results/hero-layout/
          if-no-files-found: warn
          retention-days: 7
