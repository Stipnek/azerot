name: Mobile portrait artwork layout
on:
  push:
    branches: ['work/roster-xp-and-updates']
    paths: ['src/**', 'scripts/**', '.github/workflows/mobile-art.yml']
  pull_request:
    branches: ['main']
    paths: ['src/**', 'scripts/**', '.github/workflows/mobile-art.yml']
permissions:
  contents: read
jobs:
  portrait:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_game.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 scripts/test_mobile_art.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-art-layout-results
          path: results/mobile-art/
          retention-days: 14
