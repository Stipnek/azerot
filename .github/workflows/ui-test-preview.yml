name: Publish isolated UI test preview
on:
  push:
    branches: ['work/ui-redesign-clean']
    paths: ['.github/workflows/ui-test-preview.yml']
permissions:
  contents: write
concurrency:
  group: ui-test-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/work/ui-redesign-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require passed validation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('docs/validation/ui-redesign-ci.json').read_text())
          assert r['all_passed'] is True
          assert all(v == 'success' for v in r['steps'].values())
          PY
      - run: python3 scripts/check_source_edits.py
      - run: python3 scripts/build_game.py
      - name: Verify exact tested build
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          r = json.loads(Path('docs/validation/ui-redesign-ci.json').read_text())
          raw = Path('preview/index.html').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == r['build_sha256'], 'Build differs from validated game; stop'
          assert b'</html>' in raw.lower()
          PY
      - name: Commit preview only and record immutable link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- preview/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'preview: store exact validated UI build'
          fi
          export PREVIEW_COMMIT="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          commit = os.environ['PREVIEW_COMMIT']
          report = {'preview_commit': commit, 'build_sha256': hashlib.sha256(Path('preview/index.html').read_bytes()).hexdigest(), 'url': 'https://raw.githack.com/Stipnek/azerot/' + commit + '/preview/index.html', 'hosting': 'Third-party raw.githack.com proxy of public repository; main and GitHub Pages unchanged', 'browser_verified': False}
          Path('docs/validation/ui-test-preview.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Test preview: ' + report['url'] + '\nBrowser acceptance not yet performed.\n')
          PY
          git add -- docs/validation/ui-test-preview.json
          if ! git diff --cached --quiet; then
            git commit -m 'preview: record immutable test link'
          fi
          git push origin HEAD:refs/heads/work/ui-redesign-clean
