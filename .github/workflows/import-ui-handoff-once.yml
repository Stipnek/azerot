name: Import verified UI handoff once
on:
  push:
    branches: ['work/ui-redesign-clean']
    paths: ['.github/workflows/import-ui-handoff-once.yml']
permissions:
  contents: write
concurrency:
  group: import-ui-handoff-clean
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/work/ui-redesign-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify base and import exact source bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          BASE = '10337cd359d3c00ad58ed832f310892c4493d612'
          SOURCE = 'e7b60e81b6429f7bdd97c5b56d3a293c879c7bb0'
          WORKFLOW = '.github/workflows/import-ui-handoff-once.yml'
          PREFIX = 'Azerot_handoff/HANDOFF_CHANGED_ONLY/'
          files = {
              'src/template.html': 'bd6e334019f13d8b978aad8112c969f6f305c0bb89479e11004f762a43833fdd',
              'src/styles-29.css': '18e8fc9e0b60ae757b81e55b77be766005dcc12162e18d597301744667c2c7a3',
              'src/scripts/script-06.zzzzzzzzzzzz.review-ui.edits.json': '83de355c6b54575b1d69444be700375d83062996058fd7f2f39b40da6d7e78f3',
              'src/scripts/script-17.zzzzzzzzzzzz.review-ui.edits.json': '6f10be6967f30509a87796864b782baf6a09fa77ffb9bdfa6c1b3babe20dd1d4',
              'scripts/test_dungeon_lobby.py': '8989bb7fb3bfcba6a8ae39bca79aa546e3ce7bad75623665efbbdb2451f169cd',
              'scripts/test_party_quest_ui.py': '3ebd5728d8b16784385b7802bfaba37c50dae495b88ae5f9264ae1487bc843bf',
              'scripts/browser_ui_review.cjs': '16747acc8c636b07419c67252021e4afc0555cf769bc598693fe06b91d31b1ac',
              'CHANGELOG.md': '4b757cffbd79ad0014541a06e61a1f77a1ce98386e8a79bbbf4514f7ae769368',
              'docs/ui-review-register.md': 'c99cd4b7d031ebb7f2452b1bca341af2c7188bce5484f6368c217f3ef0044b42',
          }
          subprocess.run(['git', 'merge-base', '--is-ancestor', BASE, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', BASE, 'HEAD'], text=True).splitlines()
          if changed != [WORKFLOW]:
              raise SystemExit('Clean branch changed unexpectedly: ' + repr(changed))
          payloads = {}
          for target, expected in files.items():
              raw = subprocess.check_output(['git', 'show', SOURCE + ':' + PREFIX + target])
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit('SHA-256 mismatch: ' + target)
              payloads[target] = raw
          for target, raw in payloads.items():
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              print('Verified and imported:', target, hashlib.sha256(raw).hexdigest())
          PY
      - name: Check source edit invariants
        run: python3 scripts/check_source_edits.py
      - name: Run Node module regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in scripts/test_*.cjs; do
            node "$test"
          done
      - name: Check Python test syntax
        run: python3 -m py_compile scripts/test_dungeon_lobby.py scripts/test_party_quest_ui.py
      - name: Commit nine-file import and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/template.html src/styles-29.css src/scripts/script-06.zzzzzzzzzzzz.review-ui.edits.json src/scripts/script-17.zzzzzzzzzzzz.review-ui.edits.json scripts/test_dungeon_lobby.py scripts/test_party_quest_ui.py scripts/browser_ui_review.cjs CHANGELOG.md docs/ui-review-register.md
          git rm -- .github/workflows/import-ui-handoff-once.yml
          git diff --cached --check
          git commit -m 'ui: import nine verified handoff files into clean review branch' -m 'Source: e7b60e81b6429f7bdd97c5b56d3a293c879c7bb0. SHA-256 verified for all nine files. Source invariants and Node suites executed before this commit. Python browser tests only syntax-checked here; full build, browser acceptance and publication are not claimed. One-shot import workflow removed.'
          git push origin HEAD:refs/heads/work/ui-redesign-clean
