name: Player feedback checks
on:
  # PRs into main (e.g. #17 feature/talent-tree-restyle). Plain pull_request (not
  # pull_request_target): PR code runs with a read-only token and no secrets.
  # github.sha here is the merge candidate refs/pull/N/merge (PR head merged onto
  # current main), not the branch head; both SHAs are printed by "Record tested SHAs".
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths: ['src/**', 'scripts/**', '.github/workflows/player-feedback-checks.yml']
permissions:
  contents: read
concurrency:
  # PR runs share refs/pull/N/merge, so a newer push to the PR cancels the older run.
  group: player-feedback-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  SOURCE_COMMIT: ${{ github.sha }}
jobs:
  source-and-modules:
    # 'edited' is only needed for a base-branch change; skip title/body edits.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record tested SHAs
        run: |
          echo "event=${{ github.event_name }} tested=$SOURCE_COMMIT"
          echo "pr_head=${{ github.event.pull_request.head.sha }} pr_base=${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source identity and edits
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/check_source_edits.py
      - name: Run every Node regression, retaining failures
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for test in scripts/test_*.cjs; do
            echo "::group::$test"
            node "$test" || failed=1
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Coin asset unit tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts -p test_coin_assets.py
      - name: Build combined candidate from current sources
        if: ${{ !cancelled() }}
        run: python3 scripts/build_combined_preview.py
  browser:
    # 'edited' is only needed for a base-branch change; skip title/body edits.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record tested SHAs
        run: |
          echo "event=${{ github.event_name }} tested=$SOURCE_COMMIT"
          echo "pr_head=${{ github.event.pull_request.head.sha }} pr_base=${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build combined candidate
        run: python3 scripts/build_combined_preview.py
      - run: python -m pip install playwright==1.56.0
      - name: Install Chromium
        id: browser-ready
        run: python -m playwright install --with-deps chromium
      - name: Existing combined preview acceptance
        run: python3 scripts/test_combined_preview.py
      - name: Eight classes on combined HTML and entry screen
        if: ${{ !cancelled() && steps.browser-ready.outcome == 'success' }}
        run: python3 scripts/test_neutral_training_combined.py
      - name: Classic talent window (portrait, landscape, desktop)
        if: ${{ !cancelled() && steps.browser-ready.outcome == 'success' }}
        run: python3 scripts/test_talent_window_browser.py
      - name: Browser failures - annotations and summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import html, json, os, re
          from pathlib import Path

          def escaped(value):
              return str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          def prop(value):
              return escaped(value).replace(',', '%2C').replace(':', '%3A')

          root = Path('test-results')
          failed = {p.parent: p.read_text(encoding='utf-8', errors='replace')
                    for p in sorted(root.rglob('failure.txt'))}
          for p in sorted(root.rglob('result.json')):
              try:
                  result = json.loads(p.read_text(encoding='utf-8'))
              except (ValueError, OSError):
                  continue
              if result.get('status') == 'failed' and p.parent not in failed:
                  failed[p.parent] = str(result.get('failure') or result.get('error')
                                         or 'Failed without traceback; inspect measurements below.')
          summary = ['# Browser failure diagnostics\n',
                     'Tested commit: `' + os.environ.get('SOURCE_COMMIT', 'unknown') + '`\n']
          for folder, trace in failed.items():
              title = str(folder.relative_to(root))
              frames = re.findall(r'File "([^"]+)", line (\d+)', trace)
              frames = [(f, n) for f, n in frames if f.startswith('scripts/') or '/scripts/' in f]
              location = ''
              if frames:
                  filename, line = frames[-1]
                  filename = 'scripts/' + filename.split('/scripts/', 1)[-1] if '/scripts/' in filename else filename
                  location = ',file=' + prop(filename) + ',line=' + line
              message = trace[-6000:]
              print('::error title=' + prop(title) + location + '::' + escaped(message), flush=True)
              print('FAILED: ' + title, flush=True)
              for text in trace.splitlines():
                  print('  ' + text, flush=True)
              summary.append('## ' + html.escape(title) + '\n<pre>' + html.escape(trace) + '</pre>\n')
              result_path = folder / 'result.json'
              if result_path.is_file():
                  measurements = result_path.read_text(encoding='utf-8', errors='replace')
                  summary.append('### Measurements\n<pre>' + html.escape(measurements) + '</pre>\n')
          if not failed:
              note = 'No saved failure reports found. This does not establish that all test steps passed; check their outcomes.'
              print(note)
              summary.append(note + '\n')
          destination = os.environ.get('GITHUB_STEP_SUMMARY')
          if destination:
              with open(destination, 'a', encoding='utf-8') as stream:
                  stream.write('\n'.join(summary))
          PY
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-feedback-browser-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/combined-preview/
            test-results/neutral-training-combined/
            test-results/arms-tree-layout/
            preview/combined-build.json
            preview/*.html
