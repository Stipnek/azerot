name: Publish Azerot
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'index.html', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'index.html', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this workflow commit after successful checks'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: azerot-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
env:
  SOURCE_COMMIT: ${{ github.sha }}
jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - run: python3 scripts/check_source_edits.py
      - name: Run module regressions
        run: |
          for test in scripts/test_*.cjs; do
            node "$test"
          done
      - run: python3 -m unittest discover -s scripts -p test_coin_assets.py
      - run: python3 scripts/build_game.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 scripts/test_dungeon_lobby.py
      - name: Build combined entry and hero release candidate
        run: python3 scripts/build_combined_preview.py
      - name: Verify eight-class training in the candidate engine
        run: python3 scripts/test_neutral_training_browser.py
      - name: Verify the exact combined HTML before packaging
        run: python3 scripts/test_combined_preview.py
      - name: Package tested source build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          raw = Path('preview/combined.html').read_bytes()
          game = raw.decode('utf-8')
          manifest = json.loads(Path('preview/combined-build.json').read_text(encoding='utf-8'))
          digest = hashlib.sha256(raw).hexdigest()
          if manifest.get('sourceCommit') != os.environ['SOURCE_COMMIT'] or manifest.get('sha256', {}).get('combined.html') != digest:
              raise SystemExit('Combined build identity changed or source commit mismatch')
          if game.count('id="pa-entry"') != 1 or game.count('window.__AZEROT_ARMS_HERO__=true;') != 1:
              raise SystemExit('Release must include entry and hero integration exactly once')
          if 'id="az-clean-crest"' not in game or '</html>' not in game.lower() or 'function dmOpenLobby()' not in game:
              raise SystemExit('Incomplete source build or missing lobby hotfix')
          loader = Path('index.html').read_text(encoding='utf-8')
          if loader.count('?v=573crest') != 1:
              raise SystemExit('Loader anchor mismatch')
          out = Path('_site')
          out.mkdir()
          (out / 'index.html').write_text(loader.replace('?v=573crest', '?v=' + digest), encoding='utf-8')
          mid = len(raw) // 2
          (out / 'game-1.txt').write_bytes(raw[:mid])
          (out / 'game-2.txt').write_bytes(raw[mid:])
          (out / 'version.json').write_text(json.dumps({'build':digest,'sourceCommit':os.environ['SOURCE_COMMIT']}), encoding='utf-8')
          if (out / 'game-1.txt').read_bytes() + (out / 'game-2.txt').read_bytes() != raw:
              raise SystemExit('Release split mismatch')
          print('Release source:', os.environ['SOURCE_COMMIT'], 'build:', digest, 'bytes:', len(raw), 'entry and hero integration enabled')
          PY
      - name: Upload playable candidate after successful checks
        uses: actions/upload-artifact@v4
        with:
          name: pocket-azeroth-playable-candidate
          retention-days: 7
          path: |
            preview/combined.html
            preview/combined-build.json
            _site/version.json
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/combined-preview/
            test-results/neutral-training-browser/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
