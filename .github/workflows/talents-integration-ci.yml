name: Talents integration CI
on:
  push:
    branches: ['work/talents-integration', 'work/pocket-entry-screen']
  pull_request:
    branches: ['work/talents-integration', 'work/pocket-entry-screen']
permissions:
  contents: read
concurrency:
  group: talents-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact tested source
        run: |
          set -euo pipefail
          mkdir -p test-results/regressions
          git rev-parse HEAD | tee test-results/regressions/source-commit.txt
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Validate source manifests
        run: |
          set -euo pipefail
          python3 scripts/check_source_edits.py 2>&1 | tee test-results/regressions/manifests.log
      - name: Run all Node module regressions
        run: |
          set -euo pipefail
          for test in scripts/test_*.cjs; do
            echo "=== $test ==="
            node "$test"
          done 2>&1 | tee test-results/regressions/node.log
      - name: Run Python coin asset tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_coin_assets.py 2>&1 | tee test-results/regressions/python.log
      - name: Build ordinary game and both isolated previews
        run: |
          set -euo pipefail
          python3 scripts/build_arms_hero.py 2>&1 | tee test-results/regressions/build-hero.log
          python3 scripts/build_arms_proto.py 2>&1 | tee test-results/regressions/build-prototype.log
          sha256sum preview/index.html preview/arms-hero.html preview/arms-proto.html | tee test-results/regressions/build-hashes.txt
      - name: Upload regression logs and exact builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talents-integration-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/regressions/
            preview/index.html
            preview/arms-hero.html
            preview/arms-proto.html
  integration-two-heroes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated integrated preview and record source
        run: |
          set -euo pipefail
          mkdir -p test-results/arms-two-heroes
          git rev-parse HEAD | tee test-results/arms-two-heroes/source-commit.txt
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 scripts/build_arms_hero.py 2>&1 | tee test-results/arms-two-heroes/build.log
          sha256sum preview/arms-hero.html > test-results/arms-two-heroes/build.sha256
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify real purchases, hero switching and two reloads
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/test_arms_two_heroes_browser.py 2>&1 | tee test-results/arms-two-heroes/browser.log
      - name: Upload browser logs, screenshots, trace and exact build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talents-integration-browser-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/arms-two-heroes/
            preview/arms-hero.html
