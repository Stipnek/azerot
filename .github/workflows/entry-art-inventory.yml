name: Entry artwork inventory
on:
  push:
    branches: ['work/pocket-entry-screen']
    paths: ['src/assets/entry/**', '.github/workflows/entry-art-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.scan.outputs.summary }}
      pair: ${{ steps.scan.outputs.pair }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scan
        name: Read PNG dimensions without changing artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, struct
          rows=[]
          for path in sorted(Path('src/assets/entry').glob('*.png')):
              with path.open('rb') as source:
                  header=source.read(24)
              if len(header)!=24 or header[:8]!=b'\x89PNG\r\n\x1a\n' or header[8:16]!=b'\x00\x00\x00\rIHDR':
                  raise SystemExit('Invalid PNG header: '+path.name)
              width,height=struct.unpack('>II',header[16:24])
              rows.append({'file':path.name,'width':width,'height':height,'bytes':path.stat().st_size})
          if not rows:
              raise SystemExit('No uploaded PNG files found')
          expected={'portrait':(852,1846),'landscape':(1672,941)}
          pair={role:[r['file'] for r in rows if (r['width'],r['height'])==size] for role,size in expected.items()}
          summary='PNGs: '+'; '.join(r['file']+' '+str(r['width'])+'x'+str(r['height']) for r in rows)
          summary=summary.replace('\n',' ').replace('\r',' ')[:240]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('summary='+summary+'\n')
              output.write('pair='+json.dumps(pair,ensure_ascii=True)+'\n')
          Path('entry-art-inventory.json').write_text(json.dumps({'sourceCommit':os.environ.get('GITHUB_SHA'),'images':rows,'candidatesByKnownDimensions':pair,'scope':'Metadata only; dimensions do not establish visual identity.'},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: entry-art-inventory
          path: entry-art-inventory.json
          retention-days: 14
  identify:
    needs: inspect
    name: ${{ needs.inspect.outputs.summary }}
    runs-on: ubuntu-24.04
    env:
      PAIR: ${{ needs.inspect.outputs.pair }}
    steps:
      - name: Require one candidate per approved orientation
        run: |
          python3 - <<'PY'
          import json, os
          pair=json.loads(os.environ['PAIR'])
          assert set(pair)=={'portrait','landscape'}, pair
          assert all(len(names)==1 for names in pair.values()), 'Missing or ambiguous candidates: '+repr(pair)
          print(json.dumps(pair,ensure_ascii=False))
          PY
