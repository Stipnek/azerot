name: Elwynn dialogue browser
on:
  push:
    branches: [work/elwynn-collection-dialogues]
    paths: ['src/**', 'scripts/**', '.github/workflows/elwynn-dialogue-browser.yml']
permissions:
  contents: read
concurrency:
  group: elwynn-dialogue-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eagan-dialogue:
    name: Eagan dialogue Chromium desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current game without publishing
        run: python3 scripts/build_game.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise Eagan dialogue in built game
        run: python3 scripts/test_elwynn_dialogue_browser.py
      - name: Retain test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elwynn-dialogue-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: results/elwynn-dialogue/
