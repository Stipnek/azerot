name: Extract embedded CSS assets
on:
  push:
    branches: ['test/css-roundtrip']
    paths: ['.github/workflows/extract-css-assets.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python3 scripts/css_assets.py --extract
      - name: Commit verified sources to test branch
        run: |
          test "$GITHUB_REF" = refs/heads/test/css-roundtrip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/styles.css src/css-assets/
          git commit -m 'Separate embedded CSS payloads from style rules'
          git push origin HEAD:refs/heads/test/css-roundtrip
