name: Deadmines loot and equipment
on:
  pull_request:
    branches: ['main']
    paths: ['src/**', 'scripts/**', '.github/workflows/deadmines-loot.yml']
permissions:
  contents: read
jobs:
  deadmines:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_source_edits.py
      - run: node scripts/test_deadmines_loot.cjs
      - run: node scripts/test_free_dungeon.cjs
      - run: node scripts/test_inventory.cjs
      - run: node scripts/test_quest_receipts.cjs
      - run: python3 scripts/build_game.py
