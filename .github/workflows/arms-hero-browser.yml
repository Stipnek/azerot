name: Integrated Arms hero browser smoke
on:
  push:
    branches: ['test/arms-talent-prototype']
    paths: ['src/**', 'scripts/**', '.github/workflows/arms-hero-browser.yml']
permissions:
  contents: read
jobs:
  arms-hero-smoke:
    if: github.ref == 'refs/heads/test/arms-talent-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source and build isolated integrated preview
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          python3 scripts/build_arms_hero.py
          sha256sum preview/arms-hero.html > test-results/arms-hero-build.sha256
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Open hero, buy one rank and verify reload persistence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee test-results/arms-hero-browser.log
          import functools
          import http.server
          import json
          import os
          import threading
          import traceback
          from pathlib import Path
          from playwright.sync_api import sync_playwright, expect

          out = Path('test-results')
          out.mkdir(exist_ok=True)
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), functools.partial(http.server.SimpleHTTPRequestHandler, directory='preview'))
          threading.Thread(target=server.serve_forever, daemon=True).start()
          url = f'http://127.0.0.1:{server.server_port}/arms-hero.html'
          normal = '{"chars":[],"sound":false,"marker":"KEEP_NORMAL_SAVE"}'
          checks, errors = [], []
          status = 'failed'
          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(viewport={'width': 1280, 'height': 900})
              context.tracing.start(screenshots=True, snapshots=True, sources=True)
              page = context.new_page()
              page.set_default_timeout(20000)
              page.on('pageerror', lambda error: errors.append(str(error)))
              page.route('https://**/*', lambda route: route.abort())
              page.route('**/favicon.ico', lambda route: route.fulfill(status=204, body=''))
              def open_hero():
                  expect(page.locator('#sel-enter')).to_be_enabled()
                  page.locator('#sel-enter').click()
                  tab = page.locator('#bnav [data-tab="hero"]')
                  expect(tab).to_be_visible()
                  tab.click()
                  expect(page.locator('#w-hero [data-arms-panel="arms-browser-fixture"]')).to_be_visible()
              try:
                  page.goto(url, wait_until='domcontentloaded')
                  page.wait_for_function('!!(window.Battle && Battle.armsIntegrated)')
                  page.evaluate('''(normal) => {
                      const id = 'arms-browser-fixture';
                      const hero = {id, name:'Проверка', cls:'warrior', race:'human', level:15,
                          hxp:{me:Battle.xpAt(15)}, specs:{me:'arms',warrior:'arms'}, party:['me'],
                          armsTalents:{}, money:0, items:{}, gear:{}, tav:{st:0,coll:{}}, q:{},
                          v57migrated:true, v57onboarding:false, intro:{elwynn:1},
                          zone:'elwynn', at:'goldshire', pos:{x:44.7,y:45.8}};
                      localStorage.setItem('azeroth-ab-setup-v5',normal);
                      localStorage.setItem('azeroth-arms-hero-v1',JSON.stringify({chars:[hero],cur:id,enc:'hogger',sound:false,compAll:false,allSpecs:false}));
                  }''', normal)
                  page.reload(wait_until='domcontentloaded')
                  open_hero()
                  checks.append('Opened integrated hero screen through character selection and navigation')
                  plus = page.locator('#w-hero [data-arms-node="ihs"]:not([data-arms-delta])')
                  expect(plus).to_have_count(1)
                  expect(plus).to_contain_text('0/3')
                  plus.click()
                  expect(plus).to_contain_text('1/3')
                  read_rank = "JSON.parse(localStorage.getItem('azeroth-arms-hero-v1')).chars.find(h=>h.id==='arms-browser-fixture').armsTalents.ihs"
                  assert page.evaluate(read_rank) == 1
                  checks.append('Purchased one rank with a real UI click and verified isolated storage')
                  page.reload(wait_until='domcontentloaded')
                  open_hero()
                  expect(plus).to_contain_text('1/3')
                  assert page.evaluate(read_rank) == 1
                  checks.append('Rank survived page reload and re-entry through the actual UI')
                  assert page.evaluate("localStorage.getItem('azeroth-ab-setup-v5')") == normal
                  assert not errors, errors
                  checks.append('Ordinary save unchanged and no uncaught JavaScript exceptions')
                  status = 'passed'
              except Exception:
                  (out / 'failure.txt').write_text(traceback.format_exc(), encoding='utf-8')
                  raise
              finally:
                  (out / 'arms-hero-browser.json').write_text(json.dumps({'status':status,'sourceCommit':os.environ['SOURCE_COMMIT'],'page':'arms-hero.html','checks':checks,'pageErrors':errors,'scope':'One desktop purchase/reload scenario. Remote artwork, audio, mobile, combat and dungeon acceptance are not tested.'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  try:
                      page.screenshot(path=str(out / 'arms-hero-final.png'), full_page=True)
                  finally:
                      context.tracing.stop(path=str(out / 'arms-hero-trace.zip'))
                      browser.close()
                      server.shutdown()
          print(json.dumps({'status':status,'checks':checks},ensure_ascii=False))
          PY
      - name: Upload exact build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arms-hero-browser-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/
            preview/arms-hero.html
