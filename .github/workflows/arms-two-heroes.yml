name: Arms two-hero isolation browser smoke
on:
  push:
    branches: ['test/arms-talent-prototype']
    paths: ['src/**', 'scripts/**', '.github/workflows/arms-two-heroes.yml']
permissions:
  contents: read
jobs:
  arms-two-heroes:
    if: github.ref == 'refs/heads/test/arms-talent-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated integrated preview
        run: |
          mkdir -p test-results/arms-two-heroes
          git rev-parse HEAD > test-results/arms-two-heroes/source-commit.txt
          python3 scripts/build_arms_hero.py
          sha256sum preview/arms-hero.html > test-results/arms-two-heroes/build.sha256
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify independent ranks across two heroes and reloads
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_arms_two_heroes_browser.py 2>&1 | tee test-results/arms-two-heroes/browser.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arms-two-heroes-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/arms-two-heroes/
            preview/arms-hero.html
