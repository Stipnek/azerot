name: Pocket Azeroth entry preview
on:
  push:
    branches: ['work/pocket-entry-screen']
  pull_request:
    branches: ['main']
    paths: ['src/entry/**', 'src/assets/entry/**', 'scripts/*entry_preview.py', 'scripts/build_game.py', 'src/build-info.js', 'scripts/coin_assets.py', '.github/workflows/pocket-entry-screen.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entry-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_source_edits.py
      - run: python3 scripts/build_entry_preview.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 scripts/test_entry_preview.py
      - name: Verify opt-in entry build matches the browser-tested preview
        run: |
          python3 scripts/build_game.py --entry-screen
          cmp preview/index.html preview/entry.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-entry-screen-results
          path: test-results/entry-screen/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-entry-screen-preview
          path: preview/entry.html
          retention-days: 14
