name: Recover pinned Arms hero browser failure
on:
  push:
    branches: ['test/arms-talent-prototype']
    paths: ['.github/workflows/arms-hero-browser-readback.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: arms-hero-f8d0bd7-readback
  cancel-in-progress: false
jobs:
  recover-browser-log:
    if: github.ref == 'refs/heads/test/arms-talent-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8d0bd731a317c48253717f06e9c9eaa936d27c8
      - name: Read only the pinned workflow and job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Stipnek/azerot/actions/runs/44977209477 > "$RUNNER_TEMP/hero-run.json"
          gh api repos/Stipnek/azerot/actions/jobs/137069666833 > "$RUNNER_TEMP/hero-job.json"
          gh run view 44977209477 --repo Stipnek/azerot --job 137069666833 --log > "$RUNNER_TEMP/hero-job.log"
      - name: Validate source and retain bounded evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((temp/'hero-run.json').read_text())
          job = json.loads((temp/'hero-job.json').read_text())
          sha = 'f8d0bd731a317c48253717f06e9c9eaa936d27c8'
          if run['head_sha'] != sha or job['run_id'] != 44977209477 or job['id'] != 137069666833:
              raise SystemExit('Pinned browser source/job mismatch')
          if job['status'] != 'completed':
              raise SystemExit('Job is not complete')
          raw = (temp/'hero-job.log').read_bytes()
          if not raw or len(raw) > 2000000:
              raise SystemExit('Empty or oversized browser log')
          out = Path('dev-readback/arms-hero-smoke')/sha
          if out.exists():
              raise SystemExit('Refusing to overwrite browser evidence')
          out.mkdir(parents=True)
          (out/'job.log').write_bytes(raw)
          meta = {'sourceCommit':sha,'workflowRun':44977209477,'jobId':137069666833,'conclusion':job['conclusion'],'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'manifest.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Store only diagnostic evidence on a separate branch
        run: |
          set -euo pipefail
          target=refs/heads/diagnostics/arms-hero-f8d0bd7
          test -z "$(git ls-remote --heads origin "$target")"
          test "$(git rev-parse HEAD)" = f8d0bd731a317c48253717f06e9c9eaa936d27c8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dev-readback/arms-hero-smoke/f8d0bd731a317c48253717f06e9c9eaa936d27c8/
          git commit -m 'chore: preserve exact integrated hero browser failure log'
          git push origin "HEAD:$target"
