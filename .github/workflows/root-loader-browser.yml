name: Root loader browser test
on:
  push:
    branches: [fix/initial-loading-screen]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_root_loader_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-loader-browser-results
          path: results/root-loader/
          retention-days: 14
