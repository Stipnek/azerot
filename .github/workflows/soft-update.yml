name: Guarded soft update implementation
on:
  push:
    branches: ['work/roster-xp-and-updates']
    paths: ['.github/workflows/soft-update.yml']
permissions:
  contents: write
concurrency:
  group: soft-update
  cancel-in-progress: false
jobs:
  implement:
    if: github.ref == 'refs/heads/work/roster-xp-and-updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/roster-xp-and-updates
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch inspected save function, update UI and loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('src/scripts/script-06.txt')
          raw=p.read_bytes()
          if hashlib.sha256(raw).hexdigest()!='b5a06fb960619261d59e8ca281f9a250c3eb0ac9b8f9c5d4fdfbdd496b7384f6':
              raise SystemExit('UI source changed; inspect again')
          text=raw.decode('utf-8')
          old="    try { localStorage.setItem(KEY, JSON.stringify({ chars: S.chars, cur: S.cur, enc: S.enc, auto: S.auto, testClear: S.testClear, allQ: S.allQ, allSpecs: !!S.allSpecs, ambTest: !!S.ambTest, compAll: S.compAll !== false, sound: S.sound !== false })); } catch (e) {}"
          new="    try { const data = JSON.stringify({ chars: S.chars, cur: S.cur, enc: S.enc, auto: S.auto, testClear: S.testClear, allQ: S.allQ, allSpecs: !!S.allSpecs, ambTest: !!S.ambTest, compAll: S.compAll !== false, sound: S.sound !== false }); localStorage.setItem(KEY, data); return localStorage.getItem(KEY) === data; } catch (e) { return false; }"
          if text.count(old)!=1: raise SystemExit('Save anchor mismatch')
          text=text.replace(old,new,1)
          addition=r'''  // AZ_SOFT_UPDATE_BEGIN
            (function () {
              const current = window.__AZEROT_RUNNING_BUILD__;
              if (!/^[a-f0-9]{64}$/.test(current || '')) return;
              let available = null, checking = false, saving = false, message = '';
              const panel = document.createElement('aside');
              panel.id = 'az-update-notice';
              panel.hidden = true;
              panel.setAttribute('aria-label', 'Обновление игры');
              panel.style.cssText = 'position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;max-width:min(340px,calc(100vw - 20px));padding:10px;background:var(--panel);color:var(--ink);border:1px solid var(--gold);border-radius:6px;box-shadow:0 3px 12px #0005';
              const label = document.createElement('p'), button = document.createElement('button');
              label.setAttribute('role', 'status');
              label.style.cssText = 'margin:0 0 6px;font-size:13px';
              button.type = 'button'; button.className = 'btn'; button.textContent = 'Обновить';
              panel.append(label, button); document.body.append(panel);
              function safe() {
                return !!S.hero && !S.walk && !S.amb && !S.pick && !tavBusy && !run && !playing
                  && $('battle').hidden && $('create').hidden && $('select').hidden && !$('world').hidden
                  && !document.querySelector('dialog[open], .qsheet:not([hidden]), #pop:not([hidden])');
              }
              function render() {
                panel.hidden = !available;
                button.disabled = saving || checking || !safe();
                const text = message || (safe() ? 'Доступно обновление. Прогресс будет сохранён.' : 'Доступно обновление. Завершите текущее действие.');
                if (label.textContent !== text) label.textContent = text;
              }
              async function check() {
                if (checking || document.hidden) return false;
                checking = true; render();
                const abort = new AbortController(), timeout = setTimeout(() => abort.abort(), 8000);
                try {
                  const response = await fetch(new URL('version.json', location.href).href, {cache:'no-store', credentials:'same-origin', signal:abort.signal});
                  if (!response.ok) return false;
                  const version = await response.json();
                  if (!/^[a-f0-9]{64}$/.test(version.build || '')) return false;
                  available = version.build === current ? null : version.build;
                  return true;
                } catch (_) { return false; }
                finally { clearTimeout(timeout); checking = false; render(); }
              }
              async function apply() {
                if (saving || checking || !available || !safe()) { render(); return false; }
                message = '';
                if (!await check()) { message = 'Не удалось проверить версию. Попробуйте позже.'; render(); return false; }
                if (!available || !safe()) { render(); return false; }
                saving = true; render();
                try {
                  if (save() !== true) throw new Error('Save failed');
                  if (!safe()) { saving = false; render(); return false; }
                  const target = new URL(location.href);
                  target.searchParams.set('azerot-update', available);
                  location.replace(target.href);
                  return true;
                } catch (_) {
                  saving = false; message = 'Не удалось сохранить прогресс. Обновление отменено.'; render(); return false;
                }
              }
              button.onclick = apply;
              document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
              window.addEventListener('focus', check);
              setInterval(check, 60000);
              setInterval(() => { if (available) render(); }, 1000);
              check();
            })();
            // AZ_SOFT_UPDATE_END
          '''
          anchor='  if (S.chars.length) showSelect(); else openCreate();'
          if text.count(anchor)!=1: raise SystemExit('Startup anchor mismatch')
          text=text.replace(anchor,addition+'\n'+anchor,1)
          loader=Path('index.html')
          html=loader.read_text(encoding='utf-8')
          old_loader='return x.arrayBuffer()'
          new_loader="if(f==='game-1.txt')window.__AZEROT_RUNNING_BUILD__=new URL(x.url,location.href).searchParams.get('v');return x.arrayBuffer()"
          if html.count(old_loader)!=1 or html.count('?v=573crest')!=1:
              raise SystemExit('Loader anchor mismatch')
          html=html.replace(old_loader,new_loader,1)
          p.write_bytes(text.encode('utf-8'))
          loader.write_bytes(html.encode('utf-8'))
          PY
      - name: Test real save and update functions in isolated environment
        run: |
          node <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const source=fs.readFileSync('src/scripts/script-06.txt','utf8');
          new vm.Script(source);
          const start=source.indexOf('// AZ_SOFT_UPDATE_BEGIN'),end=source.indexOf('// AZ_SOFT_UPDATE_END');
          assert.ok(start>=0&&end>start);
          let update=source.slice(start,end);
          const close=update.lastIndexOf('})();');
          update=update.slice(0,close)+'window.testApi={check,apply,render,panel,button,label};'+update.slice(close);
          const saveStart=source.indexOf('  function save() {'),saveEnd=source.indexOf('  function maxSize()',saveStart);
          assert.ok(saveStart>=0&&saveEnd>saveStart);
          const saveCode=source.slice(saveStart,saveEnd);
          const A='a'.repeat(64),B='b'.repeat(64),passed=[];
          const tick=()=>new Promise(resolve=>setImmediate(resolve));
          async function fixture(current=A,latest=B) {
            const env={latest,offline:false,failSave:false,badRead:false,dialog:false,reloads:[],stored:null};
            const hero={name:'Test',hxp:{me:1000}},S={hero,chars:[hero],cur:'c1',party:['me'],specs:{me:'prot'},level:3,enc:'hogger'};
            const nodes={battle:{hidden:true},create:{hidden:true},select:{hidden:true},world:{hidden:false}};
            function element(){return {hidden:false,style:{},textContent:'',setAttribute(){},append(){}};}
            const window={__AZEROT_RUNNING_BUILD__:current,addEventListener(){}};
            const context={window,S,run:null,playing:false,tavBusy:null,KEY:'azeroth-ab-setup-v5',
              $:id=>nodes[id],URL,AbortController,setTimeout,clearTimeout,setInterval(){},
              document:{hidden:false,body:{append(){}},createElement:element,addEventListener(){},querySelector:()=>env.dialog?{}:null},
              location:{href:'https://example.test/azerot/',replace:url=>env.reloads.push(url)},
              localStorage:{setItem(key,value){if(env.failSave)throw Error('quota');env.stored=value;},getItem(){return env.badRead?'wrong':env.stored;}},
              fetch:async()=>{if(env.offline)throw Error('offline');return {ok:true,json:async()=>({build:env.latest})};}};
            vm.runInNewContext(saveCode+'\n'+update,context,{timeout:1000});
            await tick();
            return {env,S,nodes,context,api:window.testApi};
          }
          (async()=>{
            let f=await fixture();assert.equal(f.api.panel.hidden,false);assert.equal(f.env.reloads.length,0);passed.push('new version notifies without automatic reload');
            f=await fixture(A,A);assert.equal(f.api.panel.hidden,true);passed.push('same build stays silent');
            f=await fixture('573crest');assert.equal(f.api,undefined);passed.push('unknown preview build does not enable updater');
            f=await fixture();f.nodes.battle.hidden=false;assert.equal(await f.api.apply(),false);assert.equal(f.env.stored,null);assert.equal(f.env.reloads.length,0);passed.push('combat blocks update');
            for(const field of ['walk','amb','pick']){f=await fixture();f.S[field]={};assert.equal(await f.api.apply(),false);assert.equal(f.env.reloads.length,0);}passed.push('travel ambush and party selection block update');
            f=await fixture();f.context.run={};assert.equal(await f.api.apply(),false);f.context.run=null;f.context.tavBusy={};assert.equal(await f.api.apply(),false);passed.push('dungeon run and summon block update');
            f=await fixture();f.env.dialog=true;assert.equal(await f.api.apply(),false);passed.push('open dialog blocks update');
            f=await fixture();f.env.failSave=true;assert.equal(await f.api.apply(),false);assert.equal(f.env.reloads.length,0);assert.ok(f.api.label.textContent.includes('сохранить'));passed.push('save failure cancels reload and shows error');
            f=await fixture();f.env.badRead=true;assert.equal(await f.api.apply(),false);assert.equal(f.env.reloads.length,0);passed.push('save readback mismatch cancels reload');
            f=await fixture();f.env.offline=true;assert.equal(await f.api.apply(),false);assert.equal(f.env.reloads.length,0);passed.push('offline check does not reload');
            f=await fixture();assert.equal(await f.api.apply(),true);assert.equal(f.env.reloads.length,1);assert.equal(JSON.parse(f.env.stored).chars[0].hxp.me,1000);assert.ok(f.env.reloads[0].includes('azerot-update='+B));passed.push('successful verified save precedes player-requested navigation');
            const loader=fs.readFileSync('index.html','utf8');assert.equal(loader.split('?v=573crest').length-1,1);assert.ok(loader.includes('window.__AZEROT_RUNNING_BUILD__'));new vm.Script(loader.match(/<script>([\s\S]*?)<\/script>/)[1]);passed.push('loader retains production version anchor and parses');
            fs.mkdirSync('dev-readback',{recursive:true});fs.writeFileSync('dev-readback/soft-update-test-results.json',JSON.stringify({status:'passed',tests:passed,sourceSha256:crypto.createHash('sha256').update(source).digest('hex'),scope:'Actual save/update functions in mocked DOM, network and storage; not a real-browser or production deployment test'},null,2)+'\n');
            console.log('Passed '+passed.length+' soft-update checks');
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS
      - name: Build preview without publishing
        run: python3 scripts/build_game.py
      - name: Commit tested implementation only to working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html src/scripts/script-06.txt dev-readback/soft-update-test-results.json
          git commit -m 'feat: add optional safe updates with verified saving'
          git push origin HEAD:refs/heads/work/roster-xp-and-updates
