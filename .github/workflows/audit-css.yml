name: Audit CSS sources
on:
  push:
    branches: ['test/css-roundtrip']
    paths: ['.github/workflows/audit-css.yml', 'scripts/audit_css.py', 'src/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/audit_css.py >> "$GITHUB_STEP_SUMMARY"
