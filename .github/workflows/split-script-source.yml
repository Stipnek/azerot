name: Migrate split script source
on:
  push:
    branches: [work/player-feedback-fixes]
    paths: [scripts/split_script_sources.py, .github/workflows/split-script-source.yml]
permissions:
  contents: write
concurrency:
  group: split-script-source-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build baseline at this exact commit
        run: |
          python3 scripts/build_game.py
          cp preview/index.html "$RUNNER_TEMP/before-split.html"
      - name: Split source and switch builder
        run: python3 scripts/split_script_sources.py
      - name: Verify lossless HTML build
        run: |
          python3 scripts/build_game.py
          cmp "$RUNNER_TEMP/before-split.html" preview/index.html
          python3 scripts/check_source_edits.py
      - name: Commit only source parts and builder on the approved branch
        env:
          TARGET_BRANCH: work/player-feedback-fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scripts/script-06.parts scripts/build_game.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: build script-06 from verified 12KB source parts'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
