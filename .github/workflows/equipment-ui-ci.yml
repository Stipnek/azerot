name: Equipment UI browser checks
on:
  pull_request:
    branches: ['main']
    paths: ['src/**', 'scripts/test_equipment_browser.py', 'scripts/build_game.py', 'scripts/coin_assets.py', '.github/workflows/equipment-ui-ci.yml']
permissions:
  contents: read
jobs:
  equipment-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_source_edits.py
      - run: python3 scripts/build_game.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 scripts/test_equipment_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equipment-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/equipment-browser/
          retention-days: 14
