name: Build and browser smoke test
on:
  push:
    branches: ['test/css-roundtrip']
    paths: ['src/**', 'scripts/**', 'DEVELOPMENT.md', '.github/workflows/browser-smoke.yml']
permissions:
  contents: read
jobs:
  baseline:
    name: Frozen baseline round-trip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 03d3f537e326718b1fdd769c8679a1fe66d03e55
          path: baseline
          persist-credentials: false
      - run: python3 scripts/build_game.py --root baseline --check-original
  smoke:
    name: Current sources browser test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current sources
        run: |
          mkdir -p results
          python3 scripts/build_game.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Check clean browser startup
        run: |
          python3 - <<'PY'
          import functools
          import http.server
          import json
          import threading
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory='preview')
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 8765), handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          errors = []
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  context = browser.new_context(viewport={'width': 844, 'height': 390})
                  page = context.new_page()
                  page.on('pageerror', lambda e: errors.append(str(e)))
                  try:
                      page.goto('http://127.0.0.1:8765/', wait_until='load', timeout=90000)
                      page.locator('#create:visible, #select:visible').first.wait_for(timeout=30000)
                      page.wait_for_timeout(3000)
                      if errors:
                          raise RuntimeError('JavaScript errors during startup: ' + repr(errors))
                  finally:
                      try:
                          page.screenshot(path='results/startup.png', full_page=True)
                      finally:
                          context.close()
                          browser.close()
          finally:
              Path('results/javascript-errors.json').write_text(json.dumps(errors, ensure_ascii=False, indent=2), encoding='utf-8')
              server.shutdown()
              server.server_close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-results
          path: results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: game-preview
          path: preview/index.html
          retention-days: 14
