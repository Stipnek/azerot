name: World map saved-zone regression
on:
  pull_request:
    branches: ['main']
    paths: ['src/**', 'scripts/**', '.github/workflows/world-map-saves.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-zones:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_game.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 scripts/test_world_map_saves.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-map-saves
          path: test-results/world-map-saves/
          retention-days: 14
