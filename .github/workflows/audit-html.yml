name: Audit HTML template
on:
  push:
    branches: ['test/css-roundtrip']
    paths: ['.github/workflows/audit-html.yml', 'scripts/audit_html.py']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/audit_html.py >> "$GITHUB_STEP_SUMMARY"
