name: Guarded recruit and replay correction
on:
  push:
    branches: ['work/roster-xp-and-updates']
    paths: ['.github/workflows/recruit-fix.yml']
permissions:
  contents: write
concurrency:
  group: recruit-fix
  cancel-in-progress: false
jobs:
  fix:
    if: github.ref == 'refs/heads/work/roster-xp-and-updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/roster-xp-and-updates
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/scripts/script-06.txt')
          raw = p.read_bytes()
          if hashlib.sha256(raw).hexdigest() != '434853bf3759bfc78db38c4a2e2238895b818527ce32843e284a1b05b8f5cc5e':
              raise SystemExit('Source changed; inspect before applying')
          text = raw.decode('utf-8')
          changes = [
              ('S.hero.hxp[id] = S.hero.hxp.me || 0; /* новичок приходит на уровне мейна */', 'S.hero.hxp[id] = 0; /* Новый спутник начинает с 1-го уровня. */'),
              ('c.v57recruit=id;c.hxp[id]=c.hxp.me||0;S.specs[id]=sp;', 'c.v57recruit=id;c.hxp[id]=0;S.specs[id]=sp;')
          ]
          for old, new in changes:
              if text.count(old) != 1:
                  raise SystemExit('Expected one match: ' + old)
              text = text.replace(old, new, 1)
          lines = text.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.startswith("    let replay=document.getElementById('v571-replay-first');")]
          if len(matches) != 1:
              raise SystemExit('Expected one replay creation line')
          lines[matches[0]] = "    document.getElementById('v571-replay-first')?.remove();\n"
          p.write_bytes(''.join(lines).encode('utf-8'))
          PY
      - name: Test real recruitment functions with isolated state
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const source = fs.readFileSync('src/scripts/script-06.txt', 'utf8');
          new vm.Script(source);
          function extract(start, end) {
            const a = source.indexOf(start), b = source.indexOf(end, a + start.length);
            assert.ok(a >= 0 && b > a);
            assert.equal(source.indexOf(start, a + 1), -1);
            return source.slice(a, b);
          }
          const paid = extract('  function tavPull() {', '  function tavReveal(');
          const free = extract('  function v57Hire(){', '  function completeV57Party(');
          function state(xp, isFree) {
            const S = { hero: { cls: 'mage', hxp: { me: xp }, v57onboarding: false }, specs: {}, party: ['me'], tab: 'map' };
            const tav = { st: 100, coll: {} };
            const noop = () => {};
            return { S, tav, tavBusy: null, v571CanFree: () => isFree, tavOf: () => tav,
              PULL_COST: 50, LIMIT: 5, RAR: [{ w: 100 }],
              B: { CLASSES: { warrior: { specs: { prot: {} } } } },
              az54HeroName: () => 'Test hero', newGid: () => 'gnew', pickRace: () => 'human',
              renderHead: noop, save: noop, tavReveal: noop, renderPrep: noop, esc: String, tavBonus: () => 0 };
          }
          const tests = ['complete UI script parses'];
          for (const xp of [0, 1000, 50000]) {
            for (const isFree of [false, true]) {
              const ctx = state(xp, isFree);
              vm.runInNewContext((isFree ? free + '\nv57Hire();' : paid + '\ntavPull();'), ctx, { timeout: 1000 });
              assert.equal(ctx.S.hero.hxp.gnew, 0);
              assert.equal(ctx.S.hero.hxp.me, xp);
              assert.ok(ctx.tav.coll.gnew);
              assert.equal(ctx.tav.st, isFree ? 100 : 50);
              tests.push((isFree ? 'free' : 'paid') + ' recruit starts at zero XP; main XP ' + xp + ' unchanged');
            }
          }
          const ctx = state(50000, false);
          ctx.tav.coll.gexisting = { cls: 'warrior', sp: 'prot', br: 0, r: 0, k: 1, n: 'Existing' };
          ctx.S.hero.hxp.gexisting = 12345;
          vm.runInNewContext(paid + '\ntavPull();', ctx, { timeout: 1000 });
          assert.equal(ctx.S.hero.hxp.gexisting, 12345);
          assert.equal(ctx.S.hero.hxp.gnew, undefined);
          assert.equal(ctx.tav.coll.gexisting.k, 2);
          tests.push('duplicate preserves existing companion XP');
          assert.ok(!source.includes("replay.textContent='Показать карту первого спутника'"));
          assert.ok(source.includes("document.getElementById('v571-replay-first')?.remove();"));
          tests.push('unapproved replay control creation removed (static check)');
          fs.mkdirSync('dev-readback', { recursive: true });
          fs.writeFileSync('dev-readback/recruit-fix-test-results.json', JSON.stringify({
            status: 'passed', sourceSha256: crypto.createHash('sha256').update(source).digest('hex'), tests,
            scope: 'Real recruitment functions with mocked dependencies and state; syntax and static UI checks. Not a browser or persistence integration test.'
          }, null, 2) + '\n');
          console.log('Passed ' + tests.length + ' checks');
          JS
      - name: Build preview without publishing
        run: python3 scripts/build_game.py
      - name: Commit tested changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/scripts/script-06.txt dev-readback/recruit-fix-test-results.json
          git commit -m 'fix: start new companions at level one and remove replay control'
          git push origin HEAD:refs/heads/work/roster-xp-and-updates
